name: parley

# Runs the BASE branch's own checker on every agreement pull request, and again when someone
# writes, edits or deletes a comment (approvals are comments). Under pull_request_target and
# issue_comment, GitHub runs this workflow file from the base or default branch, so a pull
# request cannot edit the check that judges it. The checker is read from the PR's base branch
# tip, and the PR head is fetched only as git data, never checked out or executed.
#
# The result is a commit status named "parley/<base branch>" on the PR's head commit. It is
# posted only when the base is a protected parley branch (protected_branches in the default
# branch's parley.config.yaml, or the default branch if that list is empty). Any other base gets
# no status at all, never a success. A gate job decides this first; only events that may post a
# status join the per-PR queue on the checking job. Require "parley/<your default branch>" in branch protection,
# with GitHub Actions as its expected source.
#
# The token can read the repo and write commit statuses. Anyone with write access to the repo can
# also post commit statuses from a workflow of their own, so each counterparty should work from a
# fork with read access only (see the parley README).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  # Decides whether this event may post a status at all. It runs outside the queue below, so a
  # comment from a login that is not a party never enters it and can never delay or cancel the
  # run that matters.
  gate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    outputs:
      post: ${{ steps.gate.outputs.post }}
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Read the PR base and head, and fetch the default branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          base="$(printf '%s' "$pr" | jq -r .base.ref)"
          head="$(printf '%s' "$pr" | jq -r .head.sha)"
          for v in "$base" "$DEFAULT_BRANCH"; do
            case "$v" in *[!A-Za-z0-9._/-]*|"") echo "::error::unexpected branch name"; exit 1 ;; esac
          done
          case "$head" in *[!0-9a-f]*|"") echo "::error::unexpected head sha"; exit 1 ;; esac
          { echo "base=$base"; echo "head=$head"; } >> "$GITHUB_OUTPUT"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
      - name: May this event post a status?
        id: gate
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ steps.pr.outputs.base }}
        run: |
          # Decided by the default branch's own checker and config, which this PR cannot change.
          if ! git cat-file -e "origin/$DEFAULT_BRANCH:.parley/parley.mjs" 2>/dev/null; then
            echo "The default branch has no parley setup yet. No status is posted."
            echo "post=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git show "origin/$DEFAULT_BRANCH:.parley/parley.mjs" > "$RUNNER_TEMP/gate.mjs"
          args=(gate --config-ref "origin/$DEFAULT_BRANCH" --default-branch "$DEFAULT_BRANCH" --base "$BASE_REF")
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then args+=(--commenter "$COMMENTER"); fi
          out="$(node "$RUNNER_TEMP/gate.mjs" "${args[@]}")"
          echo "$out"
          if ! printf '%s\n' "$out" | grep -qx 'protected=true'; then
            echo "Base $BASE_REF is not a protected parley branch. No status is posted for it."
            echo "post=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! printf '%s\n' "$out" | grep -qx 'party=true'; then
            echo "The comment is not from a party login, so it cannot change the result. Skipping."
            echo "post=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "post=true" >> "$GITHUB_OUTPUT"

  disclose-every-change:
    needs: gate
    if: needs.gate.outputs.post == 'true'
    runs-on: ubuntu-latest
    # One check per pull request at a time, first in first out, and a waiting run is never
    # replaced by a newer one (queue: max). Each run reads the comments when it starts, so the
    # last status posted reflects the latest approvals, including a deleted one.
    concurrency:
      group: parley-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    env:
      BASE_REF: ${{ needs.gate.outputs.base }}
      HEAD_SHA: ${{ needs.gate.outputs.head }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fetch the PR base and the PR head (as data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$BASE_REF" in *[!A-Za-z0-9._/-]*|"") echo "::error::unexpected branch name"; exit 1 ;; esac
          case "$HEAD_SHA" in *[!0-9a-f]*|"") echo "::error::unexpected head sha"; exit 1 ;; esac
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" "+refs/pull/$PR_NUMBER/head:refs/parley/head"
      - name: Every change disclosed, every agent change traced to what people said
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: lets CI run parley verify on agent-written changes. Without it, every
          # agent-written change needs the other party's approval comment.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if ! git cat-file -e "origin/$BASE_REF:.parley/parley.mjs" 2>/dev/null; then
            if git cat-file -e "origin/$BASE_REF:parley.config.yaml" 2>/dev/null; then
              echo "::error::parley.config.yaml is on $BASE_REF but .parley/parley.mjs is not. The checker was removed; restore it."
              echo "result=failure" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Base $BASE_REF has no parley setup. No status is posted."
            echo "result=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(git rev-parse refs/parley/head)" != "$HEAD_SHA" ]; then
            echo "::error::the fetched head is not the PR's head commit"
            echo "result=failure" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git show "origin/$BASE_REF:.parley/parley.mjs" > "$RUNNER_TEMP/parley.mjs"
          set +e
          node "$RUNNER_TEMP/parley.mjs" check --pr "$PR_NUMBER" --base "origin/$BASE_REF" --head refs/parley/head
          code=$?
          set -e
          if [ "$code" = 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
      - name: Post the "parley/<base>" status on the PR head
        if: always() && steps.check.outputs.result != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.check.outputs.result || 'error' }}
        run: |
          case "$RESULT" in
            success) desc="Every change is disclosed and traced to what people said." ;;
            failure) desc="Undisclosed, unapproved or synthetic changes. See the run log." ;;
            *) RESULT=error; desc="The check could not run. See the run log." ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$RESULT" -f context="parley/$BASE_REF" \
            -f description="$desc" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # The PR's own run also fails its job, so the result shows in the Checks tab.
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ] && [ "$RESULT" != success ]; then exit 1; fi
